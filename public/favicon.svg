<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Base matching App Brand -->
  <rect width="64" height="64" rx="14" fill="url(#blueGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" fill="none" />
  
  <!-- White Mail Envelope Body -->
  <rect x="11" y="18" width="42" height="28" rx="5" fill="#ffffff" />
  
  <!-- Envelope Flap Crease in Blue -->
  <path d="M12 21 L32 36 L52 21" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Subtle Bottom Fold Shadows for Depth -->
  <path d="M12 45 L25 33" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M52 45 L39 33" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
